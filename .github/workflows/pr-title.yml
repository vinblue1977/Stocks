name: PR title

# PRs are squash-merged with the PR title as the commit title, so checking the title keeps
# main's history in Conventional Commits form: https://www.conventionalcommits.org/en/v1.0.0/
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the title is "type(scope)!: description"
        env:
          TITLE: ${{ github.event.pull_request.title }}  # via env, never interpolated into the script
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add sale recording' or 'fix(api): handle empty quotes'. Got: $TITLE"
            exit 1
          fi
