name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to AWS after checks pass"
        type: boolean
        default: false

# Least privilege by default; the deploy job adds only what OIDC needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            layer/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt
      - name: Lint (includes Bandit security rules)
        run: make lint
      - name: Unit and infrastructure tests
        run: make test
      - name: Dependency vulnerability audit
        run: make audit
      - name: Synthesize and run cdk-nag security checks
        run: make synth
        env:
          CDK_DEFAULT_REGION: us-east-1

  deploy:
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production   # add required reviewers to this environment in repo settings
    permissions:
      contents: read
      id-token: write   # GitHub OIDC -> short-lived AWS credentials, no stored access keys
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Deploy
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          make layer
          . .venv/bin/activate
          npx --yes aws-cdk@2 deploy --require-approval never -c alertEmail="${ALERT_EMAIL}"
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
