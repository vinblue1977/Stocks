name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 1"  # weekly, so new advisories against current dependency versions fail `make audit`
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to AWS after checks pass"
        type: boolean
        default: false

# Least privilege by default; the deploy job adds only what OIDC needs.
permissions:
  contents: read

# Superseded PR runs are cancelled. Each run on main gets its own group so none is dropped while
# pending; the deploy job queues on its own group below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            layer/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt
      - name: Lint (includes Bandit security rules)
        run: make lint
      - name: Unit and infrastructure tests
        run: make test
      - name: Dependency vulnerability audit
        run: make audit
      - name: Synthesize and run cdk-nag security checks
        run: make synth
        env:
          CDK_DEFAULT_REGION: us-east-2

  # Fails a PR that adds a dependency with a known high-severity vulnerability.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

  # Decides whether a push to main deploys: anything outside docs, Markdown, tests and CI config
  # (except this workflow, which holds the deploy step).
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: |
          # The whole push range; an unknown base (new branch, force push) deploys.
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          else
            changed="unknown-base"
          fi
          echo "$changed"
          deployable="$(grep -Ev '^(docs/|\.github/|tests/|LICENSE$)|\.md$' <<<"$changed" || true)"
          if grep -qx '.github/workflows/ci.yml' <<<"$changed"; then deployable=yes; fi
          echo "deploy=$([ -n "$deployable" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          BEFORE: ${{ github.event.before }}

  deploy:
    needs: [checks, changes]
    # Auto on merges that change code or infra; manual dispatch stays as a fallback. Main only, and the
    # production environment and the AWS role trust both enforce that too.
    if: >-
      always() && needs.checks.result == 'success' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.changes.outputs.deploy == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 30
    environment: production   # deployment branches: main only (repo settings)
    permissions:
      contents: read
      id-token: write   # GitHub OIDC -> short-lived AWS credentials, no stored access keys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Deploy
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          make layer
          # A missing secret would silently drop the email subscriptions or names, so fail instead.
          : "${ALERT_EMAIL:?set the ALERT_EMAIL secret}" "${OWNER_NAME:?set the OWNER_NAME secret}"
          . .venv/bin/activate
          npx --yes aws-cdk@2 deploy --require-approval never \
            -c alertEmail="${ALERT_EMAIL}" -c ownerName="${OWNER_NAME}" -c partnerName="${PARTNER_NAME}" \
            --outputs-file cdk-outputs.json
        env:
          # Environment secrets, so they're masked in this public repo's logs.
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          PARTNER_NAME: ${{ secrets.PARTNER_NAME }}
      - name: Smoke test
        run: |
          site="$(jq -er '.PortfolioTracker.DashboardUrl' cdk-outputs.json)"
          api="$(jq -er '.PortfolioTracker.ApiUrl' cdk-outputs.json)"
          failed=0
          check() {
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-all-errors "$2")"
            echo "$2 -> $code (want $1)"
            [ "$code" = "$1" ] || failed=1
          }
          check 200 "$site/"
          check 401 "$api/profile"   # every API route needs a Cognito token
          # The served config must point at the new API; the sign-in page must accept the site as callback.
          config="$(curl -sf --max-time 20 --retry 3 "$site/config.json")" || { echo "config.json failed"; exit 1; }
          [ "$(jq -r .apiUrl <<<"$config")" = "$api" ] || { echo "config.json apiUrl is stale"; failed=1; }
          check 200 "$(jq -r .authDomain <<<"$config")/login?client_id=$(jq -r .clientId <<<"$config")&response_type=code&scope=openid&redirect_uri=$site/"
          exit "$failed"
