name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 1"  # weekly, so new advisories against current dependency versions fail `make audit`
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to AWS after checks pass"
        type: boolean
        default: false

# Least privilege by default; the deploy job adds only what OIDC needs.
permissions:
  contents: read

# Superseded PR runs are cancelled. Each run on main gets its own group so none is dropped while
# pending; the deploy job queues on its own group below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A push to main is always a merged PR (branch protection), and PRs must be up to date with main, so the
# merged files are what the PR's checks tested: checks and workflow-lint skip pushes. The Lambda layer is
# locked (layer/requirements.txt); the CDK and dev tools still resolve ranges, so the deploy job re-runs the
# tests and audit on what it installs (and catches advisories published since the PR).
jobs:
  # On a PR, decides whether anything besides docs changed. A docs-only PR skips checks and workflow-lint;
  # GitHub counts a skipped required job as passed, so it can still merge.
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: |
          changed="$(git diff --name-only "$BASE...$HEAD")"
          echo "$changed"
          code="$(grep -Ev '^docs/|\.md$|^LICENSE$' <<<"$changed" || true)"
          echo "docs_only=$([ -n "$changed" ] && [ -z "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  checks:
    needs: scope
    # Not on pushes (the PR already ran it) or docs-only PRs; on schedule and dispatch `scope` is skipped.
    if: always() && github.event_name != 'push' && needs.scope.result != 'failure' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm  # ESLint packages, keyed on package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            layer/requirements.*
      - name: Install dependencies
        # uv is much faster than pip; --seed keeps pip in the venv for the layer build.
        run: |
          uv venv --seed --python "$(which python)" .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          # Then the layer's locked versions (hash-checked), so tests run on exactly what ships, and a check
          # that the lockfile isn't missing anything and doesn't conflict with the dev tools.
          uv pip install --python .venv/bin/python --require-hashes --no-deps --reinstall -r layer/requirements.txt
          uv pip check --python .venv/bin/python
      - name: Install ESLint and pyright (exact versions from package-lock.json; no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint (Python with Bandit security rules and pyright types, and the dashboard's JavaScript)
        run: make lint
      - name: Unit and infrastructure tests
        run: make test
      - name: Dependency vulnerability audit
        run: make audit
      - name: Synthesize and run cdk-nag security checks
        run: make synth
        env:
          CDK_DEFAULT_REGION: us-east-2

  # Lints the workflow files: actionlint (syntax, expressions, shell) and zizmor (Actions security).
  workflow-lint:
    needs: scope
    if: always() && github.event_name != 'push' && needs.scope.result != 'failure' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # The release binary, checked against its published SHA-256 before it runs.
        run: |
          curl -sSfLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          # One GitHub annotation per finding (the line break inside the quotes ends each one).
          # shellcheck disable=SC2016  # $err is actionlint's template variable, not a shell one
          ./actionlint -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}
          {{end}}'
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          inputs: .github
          version: "1.30.1"
          advanced-security: false  # findings as PR annotations, not uploaded to code scanning
          annotations: true

  # Fails a PR that adds a dependency with a known high-severity vulnerability.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

  # Decides whether a push to main deploys: anything outside docs, Markdown, tests, CI config and the
  # dev-only ESLint files (except this workflow, which holds the deploy step).
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: |
          # The whole push range; an unknown base (new branch, force push) deploys.
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          else
            changed="unknown-base"
          fi
          echo "$changed"
          deployable="$(grep -Ev '^(docs/|\.github/|tests/|LICENSE$|package(-lock)?\.json$|eslint\.config\.js$|pyrightconfig\.json$)|\.md$' <<<"$changed" || true)"
          if grep -qx '.github/workflows/ci.yml' <<<"$changed"; then deployable=yes; fi
          echo "deploy=$([ -n "$deployable" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          BEFORE: ${{ github.event.before }}

  deploy:
    needs: [checks, changes, workflow-lint]  # checks/workflow-lint gate manual dispatch only; they skip pushes
    # Auto on merges that change code or infra; manual dispatch stays as a fallback. Main only, and the
    # production environment and the AWS role trust both enforce that too.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.changes.outputs.deploy == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy &&
        needs.checks.result == 'success' && needs.workflow-lint.result == 'success'))
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 30
    environment: production   # deployment branches: main only (repo settings)
    permissions:
      contents: read
      id-token: write   # GitHub OIDC -> short-lived AWS credentials, no stored access keys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            layer/requirements.*
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Deploy
        run: |
          uv venv --seed --python "$(which python)" .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          # Then the layer's locked versions (hash-checked), so tests run on exactly what ships, and a check
          # that the lockfile isn't missing anything and doesn't conflict with the dev tools.
          uv pip install --python .venv/bin/python --require-hashes --no-deps --reinstall -r layer/requirements.txt
          uv pip check --python .venv/bin/python
          make test audit  # the exact versions being shipped; a release or advisory since the PR stops the deploy
          make layer
          # A missing secret would silently drop the email subscriptions or names, so fail instead.
          : "${ALERT_EMAIL:?set the ALERT_EMAIL secret}" "${OWNER_NAME:?set the OWNER_NAME secret}"
          . .venv/bin/activate
          npx --yes aws-cdk@2 deploy --require-approval never \
            -c alertEmail="${ALERT_EMAIL}" -c ownerName="${OWNER_NAME}" -c partnerName="${PARTNER_NAME}" \
            --outputs-file cdk-outputs.json
        env:
          # Environment secrets, so they're masked in this public repo's logs.
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          PARTNER_NAME: ${{ secrets.PARTNER_NAME }}
      - name: Smoke test
        run: |
          site="$(jq -er '.PortfolioTracker.DashboardUrl' cdk-outputs.json)"
          api="$(jq -er '.PortfolioTracker.ApiUrl' cdk-outputs.json)"
          failed=0
          check() {
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 3 --retry-all-errors "$2")"
            echo "$2 -> $code (want $1)"
            [ "$code" = "$1" ] || failed=1
          }
          check 200 "$site/"
          check 401 "$api/profile"   # every API route needs a Cognito token
          # The served config must point at the new API; the sign-in page must accept the site as callback.
          # The deploy doesn't wait for the CloudFront cache clear, so allow edges up to 5 minutes to catch up.
          for attempt in $(seq 1 30); do
            config="$(curl -sf --max-time 20 --retry 3 "$site/config.json")" || { echo "config.json failed"; exit 1; }
            [ "$(jq -r .apiUrl <<<"$config")" = "$api" ] && break
            [ "$attempt" = 30 ] && { echo "config.json apiUrl is stale"; failed=1; break; }
            sleep 10
          done
          check 200 "$(jq -r .authDomain <<<"$config")/login?client_id=$(jq -r .clientId <<<"$config")&response_type=code&scope=openid&redirect_uri=$site/"
          exit "$failed"
