# Weekly update PRs for GitHub Actions (keeps the pinned commit SHAs current) and Python dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # cdk-nag 3 replaces the suppression API (experimental, no grouped acknowledgments yet).
      - dependency-name: cdk-nag
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /layer
    schedule:
      interval: weekly
