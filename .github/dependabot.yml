# Weekly update PRs for GitHub Actions (keeps the pinned commit SHAs current) and Python dependencies.
# Titles follow Conventional Commits ("ci(deps): ...", "build(deps): ...") to pass the PR title check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
    ignore:
      # cdk-nag 3 replaces the suppression API (experimental, no grouped acknowledgments yet).
      - dependency-name: cdk-nag
        versions: [">=3.0.0"]
  - package-ecosystem: pip
    directory: /layer
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
