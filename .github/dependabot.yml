# Weekly update PRs for GitHub Actions (keeps the pinned commit SHAs current) and Python dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /layer
    schedule:
      interval: weekly
