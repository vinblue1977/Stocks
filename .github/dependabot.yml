# Weekly update PRs for GitHub Actions (keeps the pinned commit SHAs current), Python dependencies and ESLint.
# Titles follow Conventional Commits ("ci(deps): ...", "build(deps): ...") to pass the PR title check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # skip releases younger than a week (time for a bad release to be caught and pulled)
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
  # Also covers layer/requirements.txt (pulled in by requirements-dev.txt).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # skip releases younger than a week (time for a bad release to be caught and pulled)
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
    ignore:
      # cdk-nag 3 replaces the suppression API (experimental, no grouped acknowledgments yet).
      - dependency-name: cdk-nag
        versions: [">=3.0.0"]
      # anthropic is capped <2 in layer/requirements.txt; a new major needs a deliberate upgrade.
      - dependency-name: anthropic
        versions: [">=2.0.0"]
  # ESLint and its config packages (package.json; dev only, nothing ships).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # skip releases younger than a week (time for a bad release to be caught and pulled)
    commit-message:
      prefix: build
      include: scope
    groups:
      eslint:
        patterns: ["*"]
    ignore:
      # A new ESLint major can change the recommended rules: upgrade deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
