# Weekly update PRs for GitHub Actions (keeps the pinned commit SHAs current), Python dependencies and ESLint.
# Titles follow Conventional Commits ("ci(deps): ...", "build(deps): ...") to pass the PR title check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # skip releases younger than a week (time for a bad release to be caught and pulled)
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
  # The CDK app and dev tools (requirements.txt, requirements-dev.txt).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # skip releases younger than a week (time for a bad release to be caught and pulled)
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
    ignore:
      # cdk-nag 3 replaces the suppression API (experimental, no grouped acknowledgments yet).
      - dependency-name: cdk-nag
        versions: [">=3.0.0"]
  # The Lambda layer: requirements.in holds the ranges; Dependabot regenerates the hashed requirements.txt
  # lockfile with pip-compile.
  - package-ecosystem: pip
    directory: /layer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # skip releases younger than a week (time for a bad release to be caught and pulled)
    commit-message:
      prefix: build
      include: scope
    groups:
      layer:
        patterns: ["*"]
    ignore:
      # anthropic is capped <2 in layer/requirements.in; a new major needs a deliberate upgrade.
      - dependency-name: anthropic
        versions: [">=2.0.0"]
  # The CDK CLI that deploys, plus ESLint and pyright (package.json). A CLI update PR runs the full synth.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # skip releases younger than a week (time for a bad release to be caught and pulled)
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-tools:
        patterns: ["*"]
    ignore:
      # A new ESLint major can change the recommended rules: upgrade deliberately.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
