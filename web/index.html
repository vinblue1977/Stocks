<!doctype html>
<html lang="en" class="auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Portfolio Tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Installable on phones: home-screen icon, opens full screen. -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0B1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/overview">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6"/><polyline points="6,17 11,12 14,15 20,8"/></svg>
        Portfolio Tracker
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/mine/stocks" data-route="mine" id="nav-mine">My Portfolio</a>
        <a href="#/partner/stocks" data-route="partner" id="nav-partner" hidden>Partner's Portfolio</a>
        <a href="#/news" data-route="news">News &amp; signals</a>
        <a href="#/watchlist" data-route="watchlist">Watchlist</a>
        <a href="#/alerts" data-route="alerts">Alerts</a>
      </nav>
      <div class="account" id="account" hidden>
        <button type="button" class="account-btn" id="account-btn" aria-label="Account" aria-expanded="false" aria-controls="account-menu">
          <span class="avatar" id="account-initial" aria-hidden="true"></span>
        </button>
        <div class="account-menu" id="account-menu" tabindex="-1" hidden>
          <div class="account-who" id="account-who">Signed in as<br><strong id="account-email"></strong></div>
          <a id="add-passkey">Add passkey</a>
          <button type="button" class="danger" id="sign-out">Sign out</button>
        </div>
      </div>
    </div>
  </header>
  <main id="main" class="main" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
